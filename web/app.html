<!doctype html>
<html lang="es" x-data="devSquadsApp()" x-init="init()">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevSquads // Tu sprint tech</title><script src="https://cdn.tailwindcss.com"></script><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script><script src="https://unpkg.com/htmx.org@2.0.4"></script><link rel="stylesheet" href="/static/styles.css"></head>
<body class="grid-bg min-h-screen text-slate-100"><div class="mx-auto max-w-7xl px-4 py-5 sm:px-8"><header class="flex items-center justify-between border-b border-white/10 pb-5"><a href="/app" class="font-mono text-sm text-lime-300">DEV<span class="text-white">//</span>SQUADS</a><div class="flex items-center gap-3"><span class="hidden text-sm text-slate-400 sm:inline" x-text="goalLabel"></span><button class="button-quiet text-sm" @click="logout()">Salir</button></div></header><div class="grid gap-8 py-8 lg:grid-cols-[220px_1fr_280px]"><aside class="space-y-3"><p class="eyebrow">Tu sprint · semana <span x-text="week"></span>/4</p><button class="nav-item" :class="{active:view==='mission'}" @click="view='mission'">⚡ Mi misión</button><button class="nav-item" :class="{active:view==='squad'}" @click="view='squad'; loadPosts()">◈ Mi squad</button><button class="nav-item" :class="{active:view==='jobs'}" @click="view='jobs'">↗ Oportunidades</button><div class="mt-8 rounded-xl border border-lime-300/20 bg-lime-300/5 p-4 text-sm text-slate-300"><p class="font-semibold text-lime-200">Aprende mientras usas</p><p class="mt-2 leading-6">HTMX puede pedir HTML sin recargar toda la página.</p><button class="mt-3 text-lime-300 underline" hx-get="/ui/lesson" hx-target="#lesson" hx-swap="innerHTML">Ver cómo funciona</button><div id="lesson" class="mt-3 text-xs leading-5"></div></div></aside><main><template x-if="view==='mission'"><div><div class="mb-7"><p class="eyebrow">Checkpoint 01 · objetivo en movimiento</p><h1 class="text-4xl font-black sm:text-5xl">Construí algo que puedas mostrar.</h1><p class="mt-4 max-w-2xl text-lg leading-8 text-slate-400">Un sprint de cuatro semanas para dejar de consumir tutoriales y terminar un proyecto real.</p></div><div class="panel mb-5 border-lime-300/30"><div class="flex flex-wrap items-start justify-between gap-4"><div><p class="eyebrow">Misión de esta semana</p><h2 class="mt-2 text-2xl font-bold">Tu primer endpoint que importa</h2><p class="mt-2 max-w-xl text-slate-400">Creá un endpoint, escribí un test y explicá la decisión en un README.</p></div><span class="badge">+120 XP</span></div><div class="mt-6 h-2 overflow-hidden rounded-full bg-white/10"><div class="h-full w-2/5 rounded-full bg-lime-300"></div></div><div class="mt-3 flex justify-between text-sm text-slate-400"><span>2 de 5 pasos</span><span>vence el domingo</span></div><button class="button-primary mt-6" @click="completeMission()" x-text="missionDone ? 'Misión completada ✓' : 'Marcar avance'"></button></div><div class="grid gap-4 sm:grid-cols-3"><div class="stat-card"><span>Racha</span><b>4 días</b><small>no la cortes hoy</small></div><div class="stat-card"><span>XP total</span><b>280</b><small>nivel 2 · builder</small></div><div class="stat-card"><span>Squad</span><b>6/8</b><small>personas activas</small></div></div><div class="mt-5 grid gap-5 lg:grid-cols-2"><div class="panel"><p class="eyebrow">Check-in de hoy</p><h2 class="mt-2 text-xl font-bold">¿Qué vas a hacer en los próximos 30 minutos?</h2><textarea class="textarea" x-model="checkIn" placeholder="Ej: termino el handler y agrego el test…"></textarea><button class="button-primary mt-3" @click="saveCheckIn()" x-text="checkedIn ? 'Check-in guardado ✓' : 'Guardar check-in'"></button></div><div class="panel"><p class="eyebrow">Próximo checkpoint</p><h2 class="mt-2 text-xl font-bold">Demo day</h2><p class="mt-2 leading-7 text-slate-400">Viernes · 19:00 · Cada persona muestra qué construyó, aunque todavía no esté perfecto.</p><button class="button-quiet mt-3 px-0 text-lime-300" @click="view='squad'">Preparar mi demo →</button></div></div></div></template><template x-if="view==='squad'"><div><div class="mb-6"><p class="eyebrow">Tu squad · backend starters</p><h1 class="text-4xl font-black">Construimos juntos.</h1></div><form class="panel mb-6" @submit.prevent="createPost()"><textarea class="textarea" x-model="newPost" maxlength="500" placeholder="Comparte un avance, un bloqueo o una victoria…"></textarea><div class="mt-3 flex items-center justify-between"><span class="text-xs text-slate-500" x-text="`${newPost.length}/500`"></span><button class="button-primary" :disabled="!newPost.trim()">Publicar avance</button></div></form><p class="error" x-text="error" x-show="error"></p><div class="space-y-4"><template x-for="post in posts" :key="post.id"><article class="panel"><div class="flex items-center justify-between"><span class="font-mono text-xs text-lime-300">BUILDER <span x-text="post.user_id"></span></span><span class="text-xs text-slate-500">+<span x-text="post.likes"></span> ánimo</span></div><p class="mt-4 text-lg leading-8 text-slate-200" x-text="post.content"></p><div class="mt-5 flex gap-4 text-sm"><button class="text-lime-300" @click="like(post)">♥ Dar ánimo</button><button class="text-slate-400" @click="openComments(post)">Ver comentarios</button></div></article></template><p class="panel text-slate-400" x-show="!posts.length">Tu squad todavía no publicó avances. Sé quien rompe el silencio.</p></div></div></template><template x-if="view==='jobs'"><div><div class="mb-6"><p class="eyebrow">Oportunidades curadas</p><h1 class="text-4xl font-black">El próximo paso.</h1><p class="mt-3 text-slate-400">Ofertas seleccionadas para practicar y postular. El enlace lleva a la fuente original.</p></div><div class="space-y-4"><template x-for="job in jobs" :key="job.title"><article class="panel"><div class="flex flex-wrap items-start justify-between gap-4"><div><span class="badge" x-text="job.level"></span><h2 class="mt-3 text-xl font-bold" x-text="job.title"></h2><p class="mt-1 text-slate-400" x-text="job.company"></p></div><a class="button-quiet text-lime-300" :href="job.url" target="_blank" rel="noreferrer">Ver oferta ↗</a></div><div class="mt-5 flex flex-wrap gap-2"><template x-for="tag in job.tags"><span class="tag" x-text="tag"></span></template></div><p class="mt-4 text-sm leading-6 text-slate-400" x-text="job.note"></p></article></template></div></div></template></main><aside class="hidden lg:block"><div class="panel sticky top-8"><p class="eyebrow">Tu perfil</p><p class="mt-3 text-xl font-bold">Builder</p><p class="mt-1 text-sm text-slate-400" x-text="goalLabel"></p><div class="mt-6 border-t border-white/10 pt-5"><p class="text-sm text-slate-400">Progreso del sprint</p><div class="mt-3 h-2 rounded-full bg-white/10"><div class="h-full w-1/4 rounded-full bg-lime-300"></div></div><p class="mt-2 text-right font-mono text-xs text-lime-300">25%</p></div><div class="mt-6 border-t border-white/10 pt-5"><p class="text-sm text-slate-400">Siguiente acción</p><button class="mt-2 text-left text-lime-300" @click="view='mission'">Completar check-in →</button></div></div></aside></div></div></body><script src="/static/app.js"></script></html>
