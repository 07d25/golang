<!doctype html>
<html lang="es" x-data="authPage('login')" x-init="init()">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar // Checkpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="grid-bg min-h-screen text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6">
      <form class="panel w-full" @submit.prevent="submit()">
        <a class="font-mono text-xs text-lime-300" href="/">← checkpoint</a>
        <h1 class="mt-8 text-4xl font-black">Volver a la partida</h1>
        <p class="mt-3 text-slate-400">Entra para ver el feed y conversar.</p>
        <label class="field"
          >Usuario<input
            x-model="form.username"
            required
            autocomplete="username" /></label
        ><label class="field"
          >Contraseña<input
            x-model="form.password"
            required
            type="password"
            autocomplete="current-password"
        /></label>
        <p class="error" x-text="error" x-show="error"></p>
        <button
          class="button-primary mt-6 w-full"
          :disabled="loading"
          x-text="loading ? 'Entrando…' : 'Entrar'"
        ></button>
        <p class="mt-6 text-sm text-slate-400">
          ¿Primera vez?
          <a class="text-lime-300" href="/register">Crea tu cuenta</a>
        </p>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
